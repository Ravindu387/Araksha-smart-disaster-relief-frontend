<header class="fixed top-0 right-0 left-0 lg:left-72 h-20 bg-white border-b border-slate-200 flex items-center justify-between px-4 md:px-8 z-30 shadow-sm">

  <!-- Mobile hamburger + Breadcrumb -->
  <div class="flex items-center gap-3 text-sm font-medium">
    <!-- Hamburger (mobile only) -->
    <button
      type="button"
      aria-label="Open sidebar"
      class="lg:hidden w-9 h-9 flex items-center justify-center text-gray-500 hover:bg-gray-100 rounded-lg transition-colors"
      (click)="onToggleSidebar()"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>

    <!-- Breadcrumb -->
    <nav aria-label="Breadcrumb" class="flex items-center gap-2">
      <span class="text-slate-400">Admin</span>
      <span class="text-slate-300">/</span>
      <span class="font-semibold text-slate-800">{{ currentSection }}</span>
    </nav>
  </div>

  <!-- Search -->
  <div class="hidden md:flex flex-1 max-w-md mx-8 relative">
    <div class="relative w-full z-50">
      <app-icon
        name="search"
        class="w-[18px] h-[18px] text-gray-400 absolute left-3.5 top-1/2 -translate-y-1/2"
      ></app-icon>

      <input
        type="text"
        [(ngModel)]="searchQuery"
        (ngModelChange)="onSearchChange($event)"
        (focus)="onSearchFocus()"
        (keydown)="onSearchKeyDown($event)"
        placeholder="Advanced Search/Filtering..."
        aria-label="Global search"
        class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-gray-200 bg-gray-50 text-sm text-gray-700 placeholder:text-gray-400 outline-none focus:bg-white focus:ring-2 focus:ring-blue-500/25 focus:border-blue-400 transition"
      />
    </div>

    <!-- Dropdown Suggestions Menu -->
    <div
      *ngIf="showSearchSuggestions && filteredFeatures.length > 0"
      class="absolute left-0 right-0 top-full mt-2 bg-white/95 backdrop-blur-md border border-slate-100 rounded-2xl shadow-xl max-h-[380px] overflow-y-auto z-50 p-2.5 space-y-1 animate-in fade-in slide-in-from-top-3 duration-200"
    >
      <div class="px-3 py-1.5 text-[10px] font-bold text-slate-400 uppercase tracking-wider select-none flex justify-between items-center">
        <span>Suggested Pages & Features</span>
        <span class="text-slate-300 normal-case font-normal text-[9px]">Press Enter to open</span>
      </div>

      <button
        *ngFor="let feat of filteredFeatures; let i = index"
        (click)="selectFeature(feat); $event.stopPropagation()"
        class="w-full flex items-center justify-between text-left p-3 rounded-xl hover:bg-slate-50 transition-colors cursor-pointer"
        [class.bg-slate-50]="i === activeSuggestionIndex"
      >
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center shrink-0">
            <app-icon [name]="feat.icon" class="w-4 h-4"></app-icon>
          </div>
          <div>
            <h4 class="text-xs font-bold text-slate-800 flex items-center gap-2">
              {{ feat.name }}
              <span class="px-1.5 py-0.5 rounded bg-slate-100 text-slate-400 text-[8px] font-extrabold uppercase">
                {{ feat.category }}
              </span>
            </h4>
            <p class="text-[10px] text-slate-400 mt-0.5 leading-normal max-w-[300px] truncate">
              {{ feat.description }}
            </p>
          </div>
        </div>

        <svg class="w-4 h-4 text-slate-300 hover:text-slate-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12h15m0 0l-6.75-6.75M19.5 12l-6.75 6.75"/>
        </svg>
      </button>
    </div>

    <!-- Backdrop to close dropdown -->
    <div
      *ngIf="showSearchSuggestions && filteredFeatures.length > 0"
      class="fixed inset-0 z-40 bg-transparent"
      (click)="closeSuggestions()"
    ></div>
  </div>


  <!-- Right Side -->
  <div class="flex items-center gap-3 shrink-0">

    <!-- Notifications Dropdown wrapper -->
    <div class="relative">
      <!-- Click Backdrop to auto-close dropdown -->
      <div *ngIf="showNotificationDropdown" class="fixed inset-0 z-40 cursor-default" (click)="closeNotificationDropdown()"></div>

      <button
        type="button"
        aria-label="Notifications"
        (click)="toggleNotificationDropdown()"
        class="relative w-10 h-10 rounded-full flex items-center justify-center text-gray-500 hover:bg-gray-100 hover:text-gray-700 transition-colors z-50 focus:outline-none cursor-pointer"
      >
        <app-icon
          name="bell"
          class="w-[20px] h-[20px]"
        ></app-icon>

        @if (unreadNotificationsCount > 0) {
          <span
            class="absolute top-2.5 right-2.5 w-2 h-2 rounded-full bg-rose-500 ring-2 ring-white">
          </span>
        }
      </button>

      <!-- Dropdown Menu Panel -->
      <div
        *ngIf="showNotificationDropdown"
        class="absolute right-0 mt-3 w-80 sm:w-96 bg-white border border-slate-100 rounded-2xl shadow-xl z-50 overflow-hidden animate-in fade-in slide-in-from-top-2 duration-200"
      >
        <!-- Header -->
        <div class="px-5 py-3.5 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
          <div class="flex items-center gap-2">
            <span class="font-bold text-slate-850 text-xs">Alerts & Notifications</span>
            <span
              *ngIf="unreadNotificationsCount > 0"
              class="px-2 py-0.5 rounded bg-rose-100 text-rose-650 text-[10px] font-bold"
            >
              {{ unreadNotificationsCount }} new
            </span>
          </div>
          <button
            *ngIf="unreadNotificationsCount > 0"
            (click)="markAllRead(); $event.stopPropagation()"
            class="text-[11px] font-bold text-blue-600 hover:text-blue-800 transition-colors cursor-pointer"
          >
            Mark all read
          </button>
        </div>

        <!-- Notification List -->
        <div class="max-h-[320px] overflow-y-auto divide-y divide-slate-100">
          <ng-container *ngIf="notifications.length > 0; else emptyNotifications">
            <div
              *ngFor="let notif of notifications"
              (click)="markAsRead(notif.id); $event.stopPropagation()"
              class="p-4 flex gap-3.5 hover:bg-slate-50/50 transition-colors cursor-pointer relative"
              [class.bg-blue-50/10]="!notif.read"
            >
              <!-- Left Severity Border Indicator -->
              <div
                class="w-1 self-stretch rounded-full shrink-0 min-h-[40px]"
                [ngClass]="{
                  'bg-red-500': notif.severity === 'critical',
                  'bg-orange-500': notif.severity === 'high',
                  'bg-blue-500': notif.severity === 'info',
                  'bg-green-500': notif.severity === 'success'
                }"
              ></div>

              <div class="flex-1 min-w-0">
                <div class="flex items-start justify-between gap-1">
                  <h4
                    class="text-xs font-bold text-slate-800 leading-snug"
                    [class.text-slate-900]="!notif.read"
                  >
                    {{ notif.title }}
                  </h4>
                  <span
                    class="text-[8px] font-extrabold uppercase tracking-wider px-1.5 py-0.5 rounded shrink-0"
                    [ngClass]="{
                      'bg-red-50 text-red-650 border border-red-100': notif.severity === 'critical',
                      'bg-orange-50 text-orange-650 border border-orange-100': notif.severity === 'high',
                      'bg-blue-50 text-blue-650 border border-blue-100': notif.severity === 'info',
                      'bg-green-50 text-green-650 border border-green-100': notif.severity === 'success'
                    }"
                  >
                    {{ notif.badge }}
                  </span>
                </div>
                <p class="text-[11px] text-slate-500 font-medium leading-normal mt-1">
                  {{ notif.description }}
                </p>
                <div class="flex items-center justify-between mt-2.5">
                  <span class="text-[10px] text-slate-400 font-semibold flex items-center gap-1">
                    <svg class="w-3.5 h-3.5 text-slate-300" fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24">
                      <circle cx="12" cy="12" r="10"/>
                      <polyline points="12 6 12 12 16 14"/>
                    </svg>
                    {{ notif.time }}
                  </span>
                  
                  <button
                    *ngIf="!notif.read"
                    (click)="markAsRead(notif.id); $event.stopPropagation()"
                    class="text-[10px] font-bold text-blue-600 hover:text-blue-800 transition-colors"
                  >
                    Mark read
                  </button>
                </div>
              </div>

              <!-- Unread dot indicator -->
              <div *ngIf="!notif.read" class="absolute top-4.5 right-4 w-1.5 h-1.5 bg-blue-600 rounded-full"></div>
            </div>
          </ng-container>

          <ng-template #emptyNotifications>
            <div class="flex flex-col items-center justify-center py-10 px-4 text-center text-slate-450">
              <div class="w-9 h-9 rounded-full bg-slate-50 flex items-center justify-center mb-2">
                <svg class="w-5 h-5 opacity-40 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                  <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
              </div>
              <p class="text-xs font-semibold text-slate-650">All caught up!</p>
              <p class="text-[11px] text-slate-400 mt-0.5">No unread alerts or notifications.</p>
            </div>
          </ng-template>
        </div>

        <!-- Footer -->
        <div class="border-t border-slate-100 p-2 bg-slate-50/30 text-center">
          <button
            (click)="goToNotificationsPage(); $event.stopPropagation()"
            class="text-xs font-bold text-slate-600 hover:text-slate-800 transition-colors cursor-pointer w-full py-1.5"
          >
            View all notifications
          </button>
        </div>
      </div>
    </div>

    <!-- User profile settings dropdown wrapper -->
    <div class="relative">
      <!-- Click Backdrop to auto-close dropdown -->
      <div *ngIf="showDropdown" class="fixed inset-0 z-40 cursor-default" (click)="closeDropdown()"></div>

      <button
        type="button"
        aria-label="User settings"
        class="flex items-center gap-2.5 group cursor-pointer relative z-50 focus:outline-none"
        (click)="toggleDropdown()"
      >
        <div
          class="w-9 h-9 rounded-full bg-blue-600 text-white flex items-center justify-center text-sm font-semibold shrink-0"
        >
          {{ adminInitials }}
        </div>

        <span class="hidden sm:block text-sm font-medium text-slate-700">
          {{ adminName }}
        </span>

        <app-icon
          name="chevron-down"
          class="hidden sm:block w-4 h-4 text-gray-400 group-hover:text-gray-600 transition-transform duration-200"
          [style.transform]="showDropdown ? 'rotate(180deg)' : 'none'"
        ></app-icon>
      </button>

      <!-- Dropdown Menu Panel -->
      <div
        *ngIf="showDropdown"
        class="absolute right-0 mt-3 w-56 bg-white border border-slate-100 rounded-2xl shadow-xl py-2 z-50 animate-in fade-in slide-in-from-top-2 duration-200"
      >
        <button
          (click)="goToProfile(); $event.stopPropagation()"
          class="w-full text-left px-5 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-50 transition-colors cursor-pointer"
        >
          Profile
        </button>
        <button
          (click)="goToSettings(); $event.stopPropagation()"
          class="w-full text-left px-5 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-50 transition-colors cursor-pointer"
        >
          Settings
        </button>
        <button
          (click)="goToHelp(); $event.stopPropagation()"
          class="w-full text-left px-5 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-50 transition-colors cursor-pointer"
        >
          Help Center
        </button>
        
        <div class="border-t border-slate-100 my-1.5"></div>
        
        <button
          (click)="signOut(); $event.stopPropagation()"
          class="w-full text-left px-5 py-2.5 text-sm font-semibold text-rose-500 hover:bg-rose-50/50 flex items-center gap-2 transition-colors cursor-pointer"
        >
          <!-- Exit bracket arrow SVG icon -->
          <svg class="w-4 h-4 text-rose-500 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
          Sign Out
        </button>
      </div>
    </div>

  </div>

</header>
